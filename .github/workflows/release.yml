# memory-kit releases (CONTRIBUTING.md, "Releasing"). A push to main of the public kit repository
# tags the pushed commit v<system/VERSION> and publishes a GitHub Release whose notes are that
# version's CHANGELOG.md section (system/tools/release-notes.mjs) plus the SHA-256 of install.sh
# and install.ps1 at the tag. When the tag exists already nothing happens, so later pushes are
# no-ops until system/VERSION changes.
#
# A manual run can tag an older commit: `ref` (a commit, branch or tag) and optionally `version`,
# which must equal system/VERSION at that ref. Example, to backfill v0.1.1 at its merge commit:
#   gh workflow run release.yml -f ref=<merge commit of 0.1.1> -f version=0.1.1
# The notes then still come from the CHANGELOG.md of the branch the run starts from.
#
# A vault made from this template never releases: the job skips private repositories, and it
# stops at once in any repository whose memory.json is set up ("initialized": true).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to release (empty: the commit the run starts from)'
        required: false
        default: ''
      version:
        description: 'Expected version x.y.z (empty: system/VERSION at the ref)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a manual run may release an older commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Tag and release once per version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync("memory.json", "utf8")).initialized === true ? 0 : 1)'; then
            echo "memory.json is set up: this repository is a vault, not the kit. Nothing to release."
            exit 0
          fi
          ref=${INPUT_REF:-HEAD}
          if [[ ! $ref =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::ref must be a commit, branch or tag name"
            exit 1
          fi
          if ! target=$(git rev-parse --verify --quiet "$ref^{commit}"); then
            target=$(git rev-parse --verify "origin/$ref^{commit}")
          fi
          version=$(git show "$target:system/VERSION" | tr -d '[:space:]')
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::system/VERSION at $target holds no version x.y.z: '$version'"
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::system/VERSION at $target is $version, not $INPUT_VERSION"
            exit 1
          fi
          tag="v$version"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || found=$?
          if [ "$found" = 0 ]; then
            echo "$tag exists already: nothing to do."
            exit 0
          fi
          if [ "$found" != 2 ]; then
            echo "::error::git ls-remote failed (exit $found)"
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          node system/tools/release-notes.mjs "$version" --repo "$GITHUB_REPOSITORY" > "$notes"
          sums=''
          for file in install.sh install.ps1; do
            if git cat-file -e "$target:$file" 2>/dev/null; then
              sum=$(git show "$target:$file" | sha256sum | cut -d ' ' -f 1)
              sums+="- \`$file\` $sum"$'\n'
            fi
          done
          if [ -n "$sums" ]; then
            printf '\n### Installer checksums (SHA-256)\n\n%s' "$sums" >> "$notes"
          fi
          # A backfilled older version must not become the "Latest" release.
          newest=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -V | tail -n 1)
          latest=true
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
            latest=false
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" --title "memory-kit $version" \
            --notes-file "$notes" --latest="$latest"
          echo "released $tag at $target (latest: $latest)"
