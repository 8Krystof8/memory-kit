name: Idea or feature request
description: Something memory-kit should do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public: never paste your own notes, note names, keys or private paths; a made-up example is enough.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: tools
    attributes:
      label: Which AI tools does it concern?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Cursor
        - An app over MCP (Claude Desktop, VS Code, …)
        - Any of them
