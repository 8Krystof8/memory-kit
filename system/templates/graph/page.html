<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>memory-kit graph</title>
<style>{{CSS}}</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="labels" tabindex="0" aria-label="graph"></canvas>
  <header id="bar">
    <label class="search"><span class="sr" data-l="search"></span><input id="search" type="search" autocomplete="off" spellcheck="false" data-lp="search"></label>
    <span id="matches" aria-live="polite"></span>
    <button id="fit" type="button" data-l="fit"></button>
    <button id="toggle" type="button" aria-expanded="false" aria-controls="controls" data-l="settings"></button>
  </header>
  <aside id="controls" hidden>
    <details open>
      <summary data-l="filters"></summary>
      <label><input type="checkbox" data-s="orphans"><span data-l="show_orphans"></span></label>
      <label><input type="checkbox" data-s="journal"><span data-l="show_journal"></span></label>
      <label><input type="checkbox" data-s="inbox"><span data-l="show_inbox"></span></label>
      <label><input type="checkbox" data-s="archive"><span data-l="show_archive"></span></label>
      <label><input type="checkbox" data-s="sectors"><span data-l="show_sectors"></span></label>
      <label><input type="checkbox" data-s="missing"><span data-l="show_missing"></span></label>
    </details>
    <details open>
      <summary data-l="groups"></summary>
      <div class="row"><span data-l="color_by"></span>
        <select id="color-by">
          <option value="sector" data-l="by_sector"></option>
          <option value="type" data-l="by_type"></option>
          <option value="status" data-l="by_status"></option>
        </select>
      </div>
      <ul id="legend"></ul>
    </details>
    <details>
      <summary data-l="display"></summary>
      <label class="slider"><span data-l="node_size"></span><input type="range" min="0.25" max="3" step="0.05" data-s="nodeSize"></label>
      <label class="slider"><span data-l="link_width"></span><input type="range" min="0.25" max="3" step="0.05" data-s="linkWidth"></label>
      <label class="slider"><span data-l="labels"></span><input type="range" min="0" max="1" step="0.01" data-s="labels"></label>
    </details>
    <details>
      <summary data-l="forces"></summary>
      <label class="slider"><span data-l="center"></span><input type="range" min="0" max="1" step="0.01" data-s="center"></label>
      <label class="slider"><span data-l="repel"></span><input type="range" min="0" max="1" step="0.01" data-s="repel"></label>
      <label class="slider"><span data-l="link_force"></span><input type="range" min="0" max="1" step="0.01" data-s="linkForce"></label>
      <label class="slider"><span data-l="link_distance"></span><input type="range" min="0" max="1" step="0.01" data-s="linkDistance"></label>
    </details>
    <button id="reset" type="button" data-l="reset"></button>
  </aside>
  <aside id="info" hidden>
    <button id="info-close" type="button" class="close" data-la="close">×</button>
    <h1 id="info-title"></h1>
    <p id="info-chips" class="chips"></p>
    <p id="info-desc"></p>
    <p id="info-lead" class="muted"></p>
    <p id="info-path" class="path"><code></code><button type="button" id="copy" data-l="copy_path"></button></p>
    <div class="local-row">
      <button id="local" type="button" data-l="local_graph"></button>
      <label><span data-l="depth"></span><select id="depth"><option>1</option><option>2</option><option>3</option></select></label>
    </div>
    <h2 data-l="links_out"></h2>
    <ul id="info-out" class="links"></ul>
    <h2 data-l="links_in"></h2>
    <ul id="info-in" class="links"></ul>
  </aside>
  <ol id="ticker" hidden></ol>
  <footer id="status"><span id="stats"></span><span id="live" hidden></span><span id="help" data-l="help"></span></footer>
  <p id="notice" hidden></p>
</div>
<script type="text/plain" id="layout-src">{{LAYOUT}}</script>
<script>{{APP}}</script>
<script src="{{DATA}}"></script>
</body>
</html>
