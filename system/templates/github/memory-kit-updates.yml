# memory-kit updates (docs/upgrading.md, "Hearing of a new version"). Once a night, and on a manual
# run, it asks the kit's source for its newest version with this memory's own CLI (upgrade --check,
# which only reads version tags) and tells the owner of a set-up vault with one issue labelled
# memory-kit: opened for a newer kit, renamed with a comment for a still newer one, closed after the
# upgrade. GitHub announces the issue by e-mail and in its app. The kit repository itself
# (memory.json "initialized": false) has nobody to tell; "updates": {"github": false} in
# memory.json turns it off; a source that cannot be asked is no failure.
#
# upgrade does not manage this file (system/kit.json does not list it): a changed workflow in an
# upgrade would make the vault's next push need a token with the `workflow` scope. A vault made from
# memory-kit 0.1.3 or newer has it from the template; an older one adds it once on GitHub, which
# needs no such token: `node system/memory.mjs doctor` prints a link that opens GitHub's editor with
# this path and this text filled in (the kit keeps a copy in system/templates/github/).

name: memory-kit updates

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read
  issues: write

jobs:
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Tell the owner about a newer memory-kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          [ "$(jq -r '.initialized' memory.json)" = true ] || exit 0
          out=$(node system/memory.mjs upgrade --check --json) || { echo "no answer from upgrade --check (the source could not be asked, or this memory's kit is older than 0.1.3); nothing to tell"; exit 0; }
          [ "$(jq -r '.settings.github' <<<"$out")" = true ] || exit 0
          open=$(gh issue list --state open --label memory-kit --json number,title --jq '.[0] // empty | "\(.number)\t\(.title)"')
          number=${open%%$'\t'*}
          if [ "$(jq -r '.available' <<<"$out")" = true ]; then
            title=$(jq -r '.issue.title' <<<"$out")
            jq -r '.issue.body' <<<"$out" > "$RUNNER_TEMP/memory-kit-update.md"
            if [ -z "$open" ]; then
              gh label create memory-kit --color 5b5bd6 --description "a newer memory-kit is out" --force
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/memory-kit-update.md" --label memory-kit
            elif [ "${open#*$'\t'}" != "$title" ]; then
              gh issue edit "$number" --title "$title" --body-file "$RUNNER_TEMP/memory-kit-update.md"
              gh issue comment "$number" --body "$title"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$number" --comment "$(jq -r '.closing' <<<"$out")"
          fi
